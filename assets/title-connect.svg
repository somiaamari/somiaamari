<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Let&#x27;s Create Something Beautiful"><title>Let&#x27;s Create Something Beautiful</title><defs>
