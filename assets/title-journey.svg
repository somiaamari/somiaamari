<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="My Journey in Numbers"><title>My Journey in Numbers</title><defs>
<filter id="wc" x="-25%" y="-25%" width="150%" height="150%">
